      bead          centred on V, r = 80 (Ø160 = 15.6% → ≈6 px at a 40 px icon)
    Visual mass (band + bead) centres at ≈ (420, 520): on the optical centre, weighted to the start side.
    iOS safe box 100–924: V, the mitre and the bead (712–872 × 328–488) all sit inside it.
